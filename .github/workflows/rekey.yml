name: Change passcode (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  rekey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Re-encrypt data with the new passcode
        env:
          OLD: ${{ secrets.LABEL_WATCH_PASSCODE }}
          NEW: ${{ secrets.LABEL_WATCH_PASSCODE_NEW }}
        run: |
          python - <<'EOF'
          import json, os, sys
          sys.path.insert(0, 'pipeline')
          from crypto_util import encrypt_obj, decrypt_obj
          old, new = os.environ['OLD'], os.environ['NEW']
          if not new:
              sys.exit('LABEL_WATCH_PASSCODE_NEW is not set')
          if new == old:
              sys.exit('The new passcode is the same as the old one')
          for p in ['data.enc.json', 'state/state.enc.json']:
              obj = decrypt_obj(json.load(open(p)), old)
              env = encrypt_obj(obj, new)
              assert decrypt_obj(env, new) == obj
              json.dump(env, open(p, 'w'))
              print('Re-encrypted', p)
          EOF
      - name: Commit re-encrypted data
        run: |
          git config user.name "label-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.enc.json state/state.enc.json
          git commit -m "Change site passcode"
          git push
